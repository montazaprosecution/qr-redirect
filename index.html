<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>خدمات الجمهور — جاري التحويل إلى البوابة</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f4f7f9;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
      border-top: 5px solid #0f766e;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e5e7eb;
      border-top-color: #0f766e;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px;
      color: #0f766e;
    }
    p {
      font-size: 0.96rem;
      line-height: 1.6;
      color: #4b5563;
      margin: 0 0 14px;
    }
    .status-box {
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      color: #115e59;
      margin-bottom: 16px;
    }
    .btn {
      display: none;
      background: #0f766e;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1>خدمات الجمهور — تسجيل واستعلام الطلبات</h1>
    <p id="mainMessage">جاري التحويل تلقائياً إلى أحدث رابط للبوابة...</p>
    <div class="status-box" id="statusBox">يتم الآن قراءة الرابط المحدّث...</div>
    <a id="manualLink" class="btn" href="#">فتح البوابة الآن</a>
  </div>

  <script>
    const RETRY_INTERVAL_MS = 3000;
    let attemptCount = 0;

    function extractTargetUrl(data) {
      if (!data) return null;
      if (typeof data === "string") return data.trim();
      return (data.url || data.link || data.target || data.tunnel_url || "").trim();
    }

    async function fetchLatestUrl() {
      const response = await fetch("./url.json?t=" + Date.now(), {
        cache: "no-store",
        headers: {
          "Cache-Control": "no-cache"
        }
      });
      if (!response.ok) {
        throw new Error("تعذر قراءة ملف url.json");
      }
      const data = await response.json();
      const targetUrl = extractTargetUrl(data);
      if (!targetUrl || !targetUrl.startsWith("https://")) {
        throw new Error("الرابط غير صالح");
      }
      return targetUrl;
    }

    async function tryConnect() {
      attemptCount++;
      const statusBox = document.getElementById("statusBox");
      const manualLink = document.getElementById("manualLink");

      try {
        statusBox.textContent = `المحاولة ${attemptCount}: جاري جلب رابط البوابة...`;
        const targetUrl = await fetchLatestUrl();

        manualLink.href = targetUrl;
        manualLink.style.display = "inline-block";

        statusBox.textContent = "تم العثور على الرابط، جاري التحويل الآن...";
        window.location.replace(targetUrl);
        return;
      } catch (error) {
        statusBox.textContent = `المحاولة ${attemptCount}: بانتظار تحديث الرابط — إعادة المحاولة خلال 3 ثوانٍ...`;
      }

      setTimeout(tryConnect, RETRY_INTERVAL_MS);
    }

    tryConnect();
  </script>
</body>
</html>
