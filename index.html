<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري التحويل...</title>
  <script>
    fetch('./url.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        if (data.url && data.url.startsWith('https://')) {
          window.location.replace(data.url);
        } else {
          document.body.innerText = 'الرابط غير متاح حالياً.';
        }
      })
      .catch(() => {
        document.body.innerText = 'تعذر تحميل رابط التحويل.';
      });
  </script>
</head>
<body>
  <p>جاري توجيهك إلى الرابط النشط...</p>
</body>
</html>
