<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري التحويل إلى البوابة...</title>
</head>
<body style="font-family: Tahoma, Arial, sans-serif; text-align: center; padding-top: 60px;">
  <h3>جاري التحويل إلى البوابة الإلكترونية، يرجى الانتظار...</h3>
  <script>
    fetch('./url.json?t=' + Date.now(), { cache: 'no-store' })
      .then(response => response.json())
      .then(data => {
        if (data && data.url) {
          window.location.replace(data.url);
        } else {
          document.body.innerHTML = '<h3>الرابط غير متاح حالياً، يرجى المحاولة بعد قليل.</h3>';
        }
      })
      .catch(() => {
        document.body.innerHTML = '<h3>تعذر الاتصال بالبوابة، يرجى المحاولة بعد قليل.</h3>';
      });
  </script>
</body>
</html>
